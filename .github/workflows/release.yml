name: Build and release

# Tag a commit to publish: `git tag v1.1 && git push origin v1.1`.
# The name/emblem tables are committed to the repo, so the runner builds the
# same .exe as a local build without needing WARNO installed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build
        run: python build.py

      - name: Smoke test the executable
        run: |
          $exe = (Get-ChildItem dist -Filter *.exe | Select-Object -First 1).FullName
          Write-Host "built: $exe"
          New-Item -ItemType Directory -Force -Path smoke-in, smoke-out | Out-Null
          & "$exe" smoke-in --out smoke-out --no-open
          if (-not (Test-Path "smoke-out/WARNO Replay Report.html")) {
            throw "the executable did not produce a report"
          }
          Write-Host "report generated OK"

      - uses: actions/upload-artifact@v4
        with:
          name: warno-replay-analyzer
          path: dist/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = (Get-ChildItem dist -Filter *.exe | Select-Object -First 1).FullName
          gh release create "$env:GITHUB_REF_NAME" "$exe" --generate-notes
